# A vX.Y tag on a commit of main releases it: the commit's tests must have
# passed, the binary is built and asked for its version, an archive for
# every system unibox runs on is published as the tag's GitHub release
# (`make dist`), and the Homebrew formula and the Scoop manifest in this
# repository are pointed at it and pushed to main, where `brew upgrade` and
# `scoop update` find them. Both install the archive for their system,
# checked against its SHA-256: Homebrew the macOS or Linux one, Scoop the
# Windows one. Neither builds anything, so neither needs Go.
#
# A vX.Y-pre.N tag releases the commit as a prerelease the same way, for
# the nightly channel: its GitHub release is marked a prerelease and never
# the latest, and it writes Formula/unibox-nightly.rb and
# bucket/unibox-nightly.json instead, leaving the stable formula and
# manifest as they are.
#
# The tests are not run again: they ran when the commit was pushed to main
# (test.yml), and running them twice only gives a flaky one a second chance
# to stop the release. A failure there is re-run there, then this release is
# re-run; the tag never moves.
#
# Only the last two jobs may write, and they run nothing of the
# repository's: one publishes the archives the build left, the other edits
# two files and pushes. The build, which runs its code and that of its
# dependencies, never holds a token that can write.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+", "v[0-9]+.[0-9]+-pre.[0-9]+"]

permissions: {}

# Two tags pushed together would race for main; one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tested:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for the tests of the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAGGED: ${{ github.sha }}
        run: |
          # A commit of this workflow's, pointing the formula and the
          # manifest at a release, was pushed with its token, which starts
          # no workflow, so it has no tests of its own: the tests are those
          # of the commit it follows, the code being the same.
          SHA=$TAGGED
          while files=$(git diff-tree --no-commit-id --name-only -r "$SHA") && [ -n "$files" ] &&
            ! grep -qv -e '^Formula/' -e '^bucket/' <<<"$files"; do
            SHA=$(git rev-parse "$SHA^")
          done
          if [ "$SHA" != "$TAGGED" ]; then
            echo "$TAGGED changes only Formula/ and bucket/; taking the tests of $SHA"
          fi
          # Tagged right after the push, its tests are still running: wait.
          for attempt in $(seq 1 80); do
            run=$(gh run list --repo "$REPO" --workflow test.yml --commit "$SHA" --branch main \
              --limit 1 --json databaseId,status,conclusion,url \
              --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion) \(.url)"')
            read -r id status conclusion url <<<"$run"
            if [ -z "$id" ]; then
              echo "no test run of $SHA on main yet"
            elif [ "$status" != "completed" ]; then
              echo "the tests of $SHA are $status: $url"
            elif [ "$conclusion" = "success" ]; then
              echo "the tests of $SHA passed: $url"
              exit 0
            else
              echo "::error::the tests of $SHA ended $conclusion - re-run them ($url), then re-run this release"
              exit 1
            fi
            sleep 30
          done
          echo "::error::the tests of $SHA did not finish in 40 minutes"
          exit 1

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(-pre\.[0-9]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y or vX.Y-pre.N"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is on a commit that is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and ask for the version
        run: |
          version=${GITHUB_REF_NAME#v}
          make build VERSION="$version"
          got=$(./unibox --version)
          if [ "$got" != "$version" ]; then
            echo "::error::unibox --version printed $got, not $version"
            exit 1
          fi
      - name: Build the archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [tested, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run finds the release made and replaces its archives.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          elif [[ "$TAG" == *-pre.* ]]; then
            # A nightly is never what a stable install or the release page
            # takes as the latest.
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag \
              --title "unibox ${TAG#v} (nightly)" --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag \
              --title "unibox ${TAG#v}" --generate-notes
          fi

  formula:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Empty until branch protection needs it; then a deploy key allowed
          # to push to main, and the token is not used for the push.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Point the formula and the Scoop manifest of the tag's channel at it
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SUMS: ${{ runner.temp }}/dist/checksums.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # The formula and the manifest are written whole, from the sums
            # of the archives just published; a missing sum stops the
            # release.
            version=${TAG#v}
            url="https://github.com/$REPO/releases/download/$TAG"
            # The channel: stable for vX.Y, nightly for vX.Y-pre.N, each with
            # a formula and a manifest of its own; both install unibox, so
            # the nightly one says it cannot be beside the stable one.
            name=unibox class=Unibox conflicts= scoop_check=true
            if [[ "$TAG" == *-pre.* ]]; then
              name=unibox-nightly class=UniboxNightly scoop_check=false
              conflicts='
            conflicts_with "unibox", because: "both install the unibox command"
          '
            fi
            sum() { awk -v f="unibox_${version}_$1" '$2 == f { print $1 }' "$SUMS" | grep .; }
            darwin_arm64=$(sum darwin_arm64.tar.gz)
            darwin_amd64=$(sum darwin_amd64.tar.gz)
            linux_arm64=$(sum linux_arm64.tar.gz)
            linux_amd64=$(sum linux_amd64.tar.gz)
            amd64=$(sum windows_amd64.zip)
            arm64=$(sum windows_arm64.zip)
            cat > "Formula/$name.rb" <<FORMULA
          # The release workflow (.github/workflows/release.yml) writes this file
          # whole when a vX.Y tag is pushed, from the release's archives and their
          # SHA-256 sums; change it there. brew installs the archive's binary, so
          # it needs no Go; --HEAD builds main from source.
          class $class < Formula
            desc "Wrapper over Docker Sandboxes for running coding agents locally"
            homepage "https://bitbyone.github.io/unibox/"
            version "$version"
            license "MIT"
          $conflicts
            on_macos do
              on_arm do
                url "$url/unibox_${version}_darwin_arm64.tar.gz"
                sha256 "$darwin_arm64"
              end
              on_intel do
                url "$url/unibox_${version}_darwin_amd64.tar.gz"
                sha256 "$darwin_amd64"
              end
            end

            on_linux do
              on_arm do
                url "$url/unibox_${version}_linux_arm64.tar.gz"
                sha256 "$linux_arm64"
              end
              on_intel do
                url "$url/unibox_${version}_linux_amd64.tar.gz"
                sha256 "$linux_amd64"
              end
            end

            head do
              url "https://github.com/$REPO.git", branch: "main"
              depends_on "go" => :build
            end

            def install
              if build.head?
                system "go", "build", *std_go_args(ldflags: "-X github.com/tobola/unibox/internal/version.Version=HEAD"), "./cmd/unibox"
              else
                bin.install "unibox"
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/unibox --version")
            end
          end
          FORMULA
            mkdir -p bucket
            # Scoop's own check finds the latest release, never a
            # prerelease, so only the stable manifest has one; the nightly
            # one is written here at every -pre tag.
            jq -n --arg v "$version" --arg url "$url" --arg repo "$REPO" \
              --arg amd64 "$amd64" --arg arm64 "$arm64" --argjson check "$scoop_check" '{
                version: $v,
                description: "Wrapper over Docker Sandboxes for running coding agents locally",
                homepage: "https://bitbyone.github.io/unibox/",
                license: "MIT",
                architecture: {
                  "64bit": {url: "\($url)/unibox_\($v)_windows_amd64.zip", hash: $amd64},
                  arm64: {url: "\($url)/unibox_\($v)_windows_arm64.zip", hash: $arm64}
                },
                bin: "unibox.exe"
              }
              + (if $check then {
                checkver: {github: "https://github.com/\($repo)"},
                autoupdate: {architecture: {
                  "64bit": {url: "https://github.com/\($repo)/releases/download/v$version/unibox_$version_windows_amd64.zip"},
                  arm64: {url: "https://github.com/\($repo)/releases/download/v$version/unibox_$version_windows_arm64.zip"}
                }}
              } else {} end)' > "bucket/$name.json"
            git add "Formula/$name.rb" "bucket/$name.json"
            if git diff --cached --quiet; then
              echo "the $name formula and manifest already name $TAG"
              exit 0
            fi
            git commit -m "Release $name ${TAG#v}" \
              -m "Point the Homebrew formula at the release's macOS and Linux archives of $TAG, commit $SHA, and the Scoop manifest at its Windows ones."
            # main may have moved during the tests; fetch and try again.
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::could not push the formula and the manifest to main"
          exit 1
